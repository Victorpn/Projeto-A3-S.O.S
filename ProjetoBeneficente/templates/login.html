<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login - SOS Sul</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; flex-direction: column; min-height: 100vh; margin: 0; }
        .hero { background-color: #00529B; color: white; padding: 40px 20px; text-align: center; }
        .content { flex-grow: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .login-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #FFA500; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 16px; }
        button:hover { background: #ff9900; }
        .msg { color: red; text-align: center; margin-bottom: 10px; background: #fee; padding: 5px; border-radius: 4px; }
        a { display: block; text-align: center; margin-top: 15px; color: #00529B; text-decoration: none; }
    </style>
</head>
<body>
    <div class="hero">
        <h1>SOS Sul</h1>
        <p>Painel de Controle e Doações</p>
    </div>

    <div class="content">
        <div class="login-box">
            <h2 style="text-align: center; color: #00529B;">Acessar Conta</h2>

            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    {% for message in messages %}
                        <div class="msg">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="/login" method="POST">
                <label>E-mail:</label>
                <input type="email" name="email" required placeholder="seu@email.com">
                
                <label>Senha:</label>
                <input type="password" name="senha" required placeholder="********">
                
                <button type="submit">Entrar</button>
            </form>

            <a href="/cadastro">Não tem conta? Cadastre-se</a>
        </div>
    </div>
</body>
</html>
